name: Docs

# Builds the docs site in docs/ and deploys it to Cloudflare Workers: main
# goes live, and a pull request gets a preview URL of its own. The site
# reads the skin tokens from packages/skins and publishes the crates'
# rustdoc under /api/, so changes there rebuild it too. macOS, because the
# engine and hosting crates only build there.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/skins/**"
      # The skin token and pedal kind references are read from these.
      - "ui/src/skins/**"
      - "ui/src/lib/pedal-kinds.json"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "packages/skins/**"
      # The skin token and pedal kind references are read from these.
      - "ui/src/skins/**"
      - "ui/src/lib/pedal-kinds.json"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs:
    name: Build and deploy
    runs-on: macos-latest
    env:
      # Forked pull requests have no secrets; they stop after the build.
      DEPLOY: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The crates' rustdoc into public/api, failing on any warning.
      - run: npm run rustdoc
        working-directory: docs

      # Generates the theme and social image, builds with Astro, fails on a
      # broken internal link, then checks search indexed every page.
      - run: npm run build
        working-directory: docs

      # `versions upload` (the preview path) needs the Worker to exist, and
      # only the first deploy from main creates it, so until then a pull
      # request skips its preview instead of failing.
      - name: Check whether the Worker exists
        if: env.DEPLOY == 'true'
        id: worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          name=$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' docs/wrangler.jsonc \
                 | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/${name}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          echo "lookup of $name returned HTTP $code"
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Skip preview (Worker not created yet)
        if: env.DEPLOY == 'true' && github.event_name == 'pull_request' && steps.worker.outputs.exists != 'true'
        run: echo "::notice::The Worker is created by the first deploy from main; previews work from the next pull request on."

      - name: Deploy
        id: deploy
        if: env.DEPLOY == 'true' && (github.event_name == 'push' || steps.worker.outputs.exists == 'true')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: ${{ github.event_name == 'push' && 'deploy' || 'versions upload' }}

      # The preview URL goes on the pull request as one comment, edited in
      # place on each push.
      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Docs preview: $URL ($(git rev-parse --short ${{ github.event.pull_request.head.sha }}))"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Docs preview:")))][0].id')
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR" --body "$body"
          fi
