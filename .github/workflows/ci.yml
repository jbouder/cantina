name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Two jobs in parallel: the UI checks and scene harness need no Rust, and
# the Rust job needs only the built UI, which the shell embeds.
jobs:
  ui:
    name: UI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The cantina-author skill's references are generated from the
      # schemas and the node catalog; this fails when they are stale.
      - run: node scripts/skill-references.mjs --check
      # Draws every visualizer scene in headless Chrome from recorded frames.
      - run: npm run test:scenes

  rust:
    name: Rust
    runs-on: macos-latest
    env:
      # Line tables are enough for a backtrace, and much less to compile
      # and link than full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shell embeds ui/dist at compile time, so the UI builds first.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Every example and fixture of the cantina-author skill checks and
      # renders cleanly through cantina-cli.
      - run: scripts/skill-fixtures.sh
      # Every public item is documented (the missing_docs lint), and the
      # docs have no broken or private links.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
