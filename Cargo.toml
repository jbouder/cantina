[workspace]
resolver = "2"
members = ["crates/dsp", "crates/engine", "crates/hosting"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jbouder/cantina"
rust-version = "1.85"

[workspace.dependencies]
cantina-dsp = { path = "crates/dsp" }
cantina-hosting = { path = "crates/hosting" }

[profile.release]
debug = 1
lto = "thin"

# Audio code must be fast even in dev builds or the callback underruns.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
