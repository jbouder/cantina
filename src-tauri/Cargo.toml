[package]
name = "cantina"
description = "Cantina desktop shell: owns the engine, the project and the windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cantina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
cantina-dsp.workspace = true
cantina-engine.workspace = true
cantina-hosting.workspace = true
cantina-project.workspace = true
objc2 = "0.6"
# The assistant's requests to its provider; the same build the updater uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The assistant's API key lives in the login Keychain.
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The assistant's cancel and confirm signals; the runtime Tauri already uses.
tokio = { version = "1", features = ["sync", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
# Parses the menu accelerators in the menu tests; the version Tauri uses.
muda = "0.20"
