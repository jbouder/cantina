[package]
name = "cantina-hosting"
description = "Third-party plugin hosting for Cantina: Audio Units and CLAP as Processors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
cantina-dsp.workspace = true
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "gui", "params", "latency", "state"] }
clack-host = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSApplication", "NSResponder", "NSGraphics", "NSRunningApplication"] }
objc2-audio-toolbox = "0.3"
objc2-core-audio-kit = { version = "0.3.2", default-features = false, features = ["AUGenericView", "objc2-app-kit", "objc2-audio-toolbox"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSURL", "NSString", "NSGeometry", "NSObject", "NSThread"] }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
cantina-clap-gain = { path = "../clap-fixture" }

# Editor windows need the main thread, which only a test with its own
# `main` gets.
[[test]]
name = "editor"
harness = false
