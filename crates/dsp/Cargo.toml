[package]
name = "cantina-dsp"
description = "Pure audio processing for Cantina: no I/O, no allocation on the audio path; the drum kit format and sampler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derives the JSON schemas for the pedal and kit formats, behind the
# `schema` feature so the app does not carry it.
schemars = { version = "1", optional = true }

[features]
## `cantina_dsp::schema`: the pedal and kit JSON schemas.
schema = ["dep:schemars"]

[dev-dependencies]
hound = "3.5.1"
# The schema derives in unit tests, without the feature.
schemars = "1"
