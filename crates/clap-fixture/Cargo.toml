[package]
name = "cantina-clap-gain"
description = "A tiny CLAP plugin used to test Cantina's CLAP hosting: gain plus a short delay that it reports as latency"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "audio-ports", "params", "latency", "state"] }
